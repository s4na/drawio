<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; frame-src https://embed.diagrams.net; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <meta name="description" content="draw.io XMLをブラウザ内でSVGへ変換します。">
    <title>draw.io SVG Converter</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Browser utility</p>
        <h1>draw.io → SVG</h1>
        <p class="lead">編集可能なdraw.io XMLを貼り付けて、README向けのSVGを生成します。</p>
      </header>

      <section class="panel" aria-labelledby="input-heading">
        <div class="section-heading">
          <div>
            <p class="step">01</p>
            <h2 id="input-heading">draw.io XML</h2>
          </div>
          <button id="clear-button" class="button button-quiet" type="button">クリア</button>
        </div>
        <label class="sr-only" for="xml-input">変換するdraw.io XML</label>
        <textarea
          id="xml-input"
          spellcheck="false"
          placeholder="&lt;mxfile&gt;...&lt;/mxfile&gt;"
          autocomplete="off"
        ></textarea>
        <fieldset class="options">
          <legend>変換オプション</legend>
          <label class="option">
            <input id="library-aws" type="checkbox" checked>
            AWSアイコン
          </label>
          <label class="option">
            <input id="library-gcp" type="checkbox" checked>
            Google Cloudアイコン
          </label>
          <label class="option">
            <input id="embed-images" type="checkbox" checked>
            外部画像をSVGへ埋め込む
          </label>
          <p class="option-help">
            AWSとGoogle Cloudはdraw.io公式ライブラリを読み込みます。外部画像は取得先が許可する場合にデータとして埋め込まれます。
          </p>
        </fieldset>
        <div class="actions">
          <button id="convert-button" class="button button-primary" type="button" disabled>
            SVGに変換
          </button>
          <p id="status" class="status" role="status" aria-live="polite">draw.ioを準備しています…</p>
          <button id="retry-button" class="button button-quiet" type="button" hidden>再接続</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="output-heading">
        <div class="section-heading">
          <div>
            <p class="step">02</p>
            <h2 id="output-heading">SVG</h2>
          </div>
          <div class="button-row">
            <button id="copy-button" class="button button-quiet" type="button" disabled>コピー</button>
            <button id="download-button" class="button button-quiet" type="button" disabled>ダウンロード</button>
          </div>
        </div>
        <div id="preview-empty" class="preview-empty">変換後のプレビューがここに表示されます。</div>
        <img id="preview" class="preview" alt="生成したSVGのプレビュー" hidden>
        <label class="sr-only" for="svg-output">生成したSVG</label>
        <textarea id="svg-output" class="output" readonly spellcheck="false" placeholder="&lt;svg&gt;...&lt;/svg&gt;"></textarea>
      </section>

      <footer>
        <p>
          入力内容はこのGitHub Pagesサイトへ送信されません。変換には公式の
          <a href="https://embed.diagrams.net" target="_blank" rel="noreferrer">draw.io埋め込みエディタ</a>
          を使用します。
        </p>
      </footer>
    </main>

    <iframe
      id="drawio-frame"
      class="drawio-frame"
      title="draw.io変換エンジン"
      aria-hidden="true"
      tabindex="-1"
      data-src="https://embed.diagrams.net/?embed=1&proto=json&spin=1&libraries=1&saveAndExit=0&noSaveBtn=1&noExitBtn=1&dark=0"
    ></iframe>

    <script type="module" src="./app.js"></script>
  </body>
</html>
